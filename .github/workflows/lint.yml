name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:ui
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:ui
        if: runner.os == 'Linux'
      - run: npm run package -- --dir
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ matrix.os }}
          path: |
            test-results/
            work/desktop-*.png
          if-no-files-found: ignore
