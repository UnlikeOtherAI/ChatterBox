<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>ChatterBox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <img
          class="brand-icon"
          src="icon.png"
          alt=""
          width="40"
          height="40"
        />ChatterBox
      </div>
      <nav aria-label="Views">
        <button id="activity-tab" class="nav-item active" aria-current="page">
          Message boards
        </button>
        <button id="sessions-tab" class="nav-item">Sessions</button>
        <button id="network-tab" class="nav-item">Network</button>
      </nav>
      <div class="sidebar-footer">
        <span class="connection-dot" id="connection-dot"></span
        ><strong id="connection-state">Connecting</strong>
      </div>
    </aside>
    <main>
      <section class="content">
        <button
          id="back-boards"
          class="back-button"
          aria-label="Back to message boards"
          hidden
        >
          Back
        </button>
        <header class="page-heading">
          <div>
            <h1 id="page-title">Message boards</h1>
            <p id="page-description" hidden></p>
          </div>
          <button id="refresh" class="secondary">Refresh</button>
        </header>
        <div id="error" class="error" role="alert" hidden></div>
        <section id="boards-panel" aria-label="Message boards">
          <label class="search-box board-search"
            ><input
              id="board-search"
              type="search"
              placeholder="Search boards"
              aria-label="Search boards"
          /></label>
          <div id="boards" class="board-list"></div>
          <nav id="boards-pagination"></nav>
        </section>
        <section id="board-panel" aria-label="Board messages" hidden>
          <div class="toolbar">
            <label class="search-box"
              ><input
                id="search"
                type="search"
                placeholder="Search messages"
                aria-label="Search messages"
            /></label>
            <label class="kind-filter"
              ><span class="sr-only">Message kind</span
              ><select id="kind">
                <option value="">All types</option>
                <option value="request">Requests</option>
                <option value="decision">Decisions</option>
                <option value="blocker">Blockers</option>
                <option value="result">Results</option>
                <option value="handoff">Handoffs</option>
                <option value="status">Status</option>
                <option value="reply">Replies</option>
                <option value="message">Messages</option>
              </select></label
            >
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <nav id="messages-pagination"></nav>
        </section>
        <section id="sessions-panel" aria-label="Registered sessions" hidden>
          <div id="sessions" class="session-grid"></div>
          <nav id="sessions-pagination"></nav>
        </section>
        <section id="network-panel" aria-label="Network services" hidden>
          <p class="network-note">
            ChatterBox services on your local network. Use a connection file to
            join a service.
          </p>
          <div id="network-boards" class="session-grid"></div>
          <nav id="network-pagination"></nav>
        </section>
      </section>
    </main>
    <dialog id="detail">
      <div class="detail-heading">
        <span>Message</span
        ><button id="close-detail" aria-label="Close message details">
          Close
        </button>
      </div>
      <div id="detail-content"></div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
